<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(contenidoCentral)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wedding App Online</title>
    <style>
        /* Importamos Great Vibes (Manuscrita) y Montserrat (Moderna) */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap');

        /* Reset y Estilos Base */
        body {
            margin: 0;
            padding: 0;
            background-color: #fcf5f7;
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
        }

        table {
            border-collapse: collapse;
        }

        /* Estilos Principales */
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #fcf5f7;
            padding: 40px 0;
        }

        .card {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 550px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(224, 176, 182, 0.15); /* Sombra rosada muy sutil */
            overflow: hidden;
            border: 1px solid #f2e6e8;
        }

        /* Tipografía */
        .script-title {
            font-family: 'Great Vibes', 'Brush Script MT', cursive; /* Fallback seguro */
            color: #b0657b; /* Rosa viejo oscuro */
            font-size: 48px;
            font-weight: 400;
            line-height: 1.2;
            margin: 10px 0;
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.05);
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            color: #dcb3bc; /* Rosa pastel elegante */
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .body-text {
            font-family: 'Montserrat', sans-serif;
            color: #5a5a5a;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 300;
            margin: 0 0 25px 0;
        }

        /* Botón Moderno y Minimalista */
        .btn-elegant {
            background-color: #b0657b;
            color: #ffffff !important;
            display: inline-block;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px; /* Completamente redondo */
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(176, 101, 123, 0.3);
        }

        .footer-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: #a8a8a8;
            text-align: center;
            line-height: 1.6;
        }

        /* Decoración */
        .divider {
            height: 1px;
            background-color: #f0f0f0;
            width: 60%;
            margin: 30px auto;
        }

        /* Mobile */
        @media screen and (max-width: 600px) {
            .wrapper {
                padding: 10px 0;
            }

            .card {
                width: 95% !important;
                border-radius: 8px;
            }

            .script-title {
                font-size: 36px !important;
            }

            .content-cell {
                padding: 30px 20px !important;
            }
        }
    </style>
</head>
<body>
<center class="wrapper">
    <table class="card" cellpadding="0" cellspacing="0">
        <tr>
            <td height="6" style="background: linear-gradient(90deg, #fcecef 0%, #dcb3bc 50%, #fcecef 100%);"></td>
        </tr>

        <tr>
            <td class="content-cell" align="center" style="padding: 50px 60px;">
                <div class="subtitle">MY WEDDING APP ONLINE</div>

                <div th:replace="${contenidoCentral}"></div>

            </td>
        </tr>

        <tr>
            <td align="center" style="padding: 0 40px 40px 40px;">
                <div class="divider"></div>
                <p class="footer-text">Notificación<br>
                    © 2026 My Wedding App Online
                </p>
                <p class="footer-text" style="font-style: italic; color: #dcb3bc;">"El amor es la poesía de los
                    sentidos"</p>
            </td>
        </tr>
    </table>
</center>

</body>

</html>
