# ==============================================================================
# Docker Compose - My Wedding Backend
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Spring Boot Backend Application
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-my-wedding-backend}:${IMAGE_TAG:-latest}
    container_name: wedding-backend
    restart: unless-stopped
    environment:
      # Database Configuration
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/db_myweddingapp}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}

      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_SECRET_TEMPORARY_KEY: ${JWT_SECRET_TEMPORARY_KEY}

      # Email Configuration
      SPRING_MAIL_HOST: ${EMAIL_HOST}
      SPRING_MAIL_USERNAME: ${EMAIL_USER}
      SPRING_MAIL_PASSWORD: ${EMAIL_PASS}
      EMAIL_FORM_ORIGIN: ${EMAIL_FORM_ORIGIN}

      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # JVM Optimization (override defaults if needed)
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -XX:InitialRAMPercentage=50.0
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.profiles.active=prod
    ports:
      - "8088:8080"
    networks:
      - my-wedding-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ==============================================================================
# Networks
# ==============================================================================
networks:
  my-wedding-network:
    name: my-wedding-network
    external: true