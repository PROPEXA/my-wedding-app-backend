<div class="w-full">
  @if (label()) {
    <label
      [attr.for]="inputId()"
      class="block text-sm font-semibold text-gray-700 mb-2"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500 ml-1">*</span>
      }
    </label>
  }

  <input
    [id]="inputId()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="isDisabled()"
    [attr.aria-invalid]="errorMessage() ? 'true' : null"
    [attr.aria-describedby]="errorMessage() ? inputId() + '-error' : null"
    (input)="onInputChange($event)"
    (blur)="onBlur($event)"
    (keypress)="onKeyPress($event)"
    [class]="'w-full px-4 py-3 border-2 rounded-lg focus:outline-none transition ' +
      (errorMessage() && isTouched()
        ? 'border-red-400 focus:border-red-500 bg-red-50'
        : 'border-rose-200 focus:border-rose-500') +
      (isDisabled() ? ' bg-gray-100 cursor-not-allowed opacity-60' : '')"
  />

  @if (errorMessage() && isTouched()) {
    <p
      [id]="inputId() + '-error'"
      class="mt-1 text-sm text-red-500"
      role="alert"
    >
      {{ errorMessage() }}
    </p>
  }
</div>
