<!-- Modal Backdrop -->
@if (isVisible()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"
    (click)="onBackdropClick()"
  >
    <!-- Overlay oscuro -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

    <!-- Contenido del Modal -->
    <div
      class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm sm:max-w-md overflow-hidden animate-scale-in"
      (click)="onContentClick($event)"
    >
      <!-- Header con icono -->
      <div class="pt-6 sm:pt-8 px-6 sm:px-8 text-center">
        <!-- Icono circular -->
        <div
          [class]="'mx-auto w-14 h-14 sm:w-16 sm:h-16 rounded-full flex items-center justify-center mb-4 ' + currentIcon().bgClass"
        >
          <svg
            [class]="'w-7 h-7 sm:w-8 sm:h-8 ' + currentIcon().iconClass"
            fill="currentColor"
            [attr.viewBox]="currentIcon().viewBox"
          >
            <path
              fill-rule="evenodd"
              [attr.d]="currentIcon().path"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <!-- Título -->
        <h2 class="text-lg sm:text-xl font-bold text-gray-800 mb-2">
          {{ config().title }}
        </h2>

        <!-- Mensaje -->
        @if (config().message) {
          <p class="text-sm sm:text-base text-gray-600 mb-6">
            {{ config().message }}
          </p>
        }
      </div>

      <!-- Botones -->
      <div class="px-6 sm:px-8 pb-6 sm:pb-8">
        @if (showCancelButton()) {
          <!-- Dos botones (Question o con showCancel) -->
          <div class="flex flex-col-reverse sm:flex-row gap-2 sm:gap-3">
            <app-button
              [theme]="'outline-secondary'"
              [size]="'md'"
              [fullWidth]="true"
              [onClickHandlers]="[cancel]"
            >
              {{ cancelButtonText() }}
            </app-button>
            <app-button
              [theme]="confirmButtonTheme()"
              [size]="'md'"
              [fullWidth]="true"
              [onClickHandlers]="[confirm]"
            >
              {{ confirmButtonText() }}
            </app-button>
          </div>
        } @else {
          <!-- Un solo botón -->
          <app-button
            [theme]="confirmButtonTheme()"
            [size]="'md'"
            [fullWidth]="true"
            [onClickHandlers]="[confirm]"
          >
            {{ confirmButtonText() }}
          </app-button>
        }
      </div>
    </div>
  </div>
}
