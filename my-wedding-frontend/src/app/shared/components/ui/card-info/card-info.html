<div class="bg-white rounded-xl shadow-md p-4 sm:p-6 hover:shadow-lg transition-shadow">
  <div class="flex items-center gap-3 sm:gap-4">
    <div class="p-2 sm:p-3 bg-gray-50 rounded-lg">
      <svg
        [class]="'w-6 h-6 sm:w-8 sm:h-8 ' + getColor"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          [attr.d]="getIcon"
        />
      </svg>
    </div>
    <div>
      <p class="text-2xl sm:text-3xl font-bold text-gray-800">{{ value() }}</p>
      <p class="text-xs sm:text-sm text-gray-500">{{ label() }}</p>
    </div>
  </div>
</div>
