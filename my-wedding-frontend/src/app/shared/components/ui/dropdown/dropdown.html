<div class="w-full">
  @if (label()) {
    <label
      [attr.for]="dropdownId()"
      class="block text-sm font-semibold text-gray-700 mb-2"
    >
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500 ml-1">*</span>
      }
    </label>
  }

  <div class="relative">
    <select
      [id]="dropdownId()"
      [value]="value()"
      [disabled]="isDisabled()"
      [attr.aria-invalid]="errorMessage() ? 'true' : null"
      [attr.aria-describedby]="errorMessage() ? dropdownId() + '-error' : null"
      (change)="onSelectionChange($event)"
      (blur)="onBlur()"
      [class]="'w-full px-4 py-3 border-2 rounded-lg focus:outline-none transition appearance-none cursor-pointer bg-white pr-10 ' +
        (errorMessage() && isTouched()
          ? 'border-red-400 focus:border-red-500 bg-red-50'
          : 'border-rose-200 focus:border-rose-500') +
        (isDisabled() ? ' bg-gray-100 cursor-not-allowed opacity-60' : '')"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value()">
          {{ placeholder() }}
        </option>
      }
      @for (option of options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled"
          [selected]="value() === option.value"
        >
          {{ option.label }}
        </option>
      }
    </select>

    <!-- Icono de flecha -->
    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
      <svg
        class="w-5 h-5 text-gray-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 9l-7 7-7-7"
        />
      </svg>
    </div>
  </div>

  @if (errorMessage() && isTouched()) {
    <p
      [id]="dropdownId() + '-error'"
      class="mt-1 text-sm text-red-500"
      role="alert"
    >
      {{ errorMessage() }}
    </p>
  }
</div>
