<!-- ═══════════════════════════════════════════════════════════════════════════
     EVENTS PANEL - Panel de control de eventos
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="min-h-screen bg-linear-to-br from-purple-50 via-indigo-50 to-blue-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: HEADER DEL PANEL
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="mb-8">
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="bg-linear-to-r from-purple-400 to-indigo-500 px-6 py-6 sm:px-8 sm:py-8">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <!-- Título -->
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
              </div>
              <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white">Mis Eventos</h1>
                <p class="text-purple-100 text-sm">Gestiona los eventos de tus bodas</p>
              </div>
            </div>

            <!-- Botón Nuevo Evento -->
            <app-button
              type="button"
              theme="light"
              size="md"
              [fullWidth]="false"
              [disabled]="!hasWeddingSelected()"
              [onClickHandlers]="[onCreateEvent]"
            >
              <span class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                Nuevo Evento
              </span>
            </app-button>
          </div>
        </div>

        <!-- Barra decorativa -->
        <div class="h-1 bg-linear-to-r from-purple-300 via-indigo-400 to-blue-400"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: SELECTOR DE BODA Y FILTROS
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="mb-6">
      <div class="bg-white rounded-xl shadow-md p-4">
        <div class="flex flex-col sm:flex-row gap-4">
          <!-- Dropdown de selección de boda -->
          <div class="flex-1">
            <div
              class="appDropdown"
              [formControl]="weddingControl"
              dropdownId="wedding-selector"
              [options]="weddingOptions()"
              placeholder="Selecciona una boda para ver sus eventos..."
              label="Boda"
            ></div>
          </div>

          <!-- Contador de eventos -->
          <div class="flex items-end">
            <div class="flex items-center gap-2 px-4 py-3 bg-purple-50 rounded-lg">
              <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <span class="text-purple-700 font-semibold">{{ events().length }} eventos</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: LISTADO DE EVENTOS (Componente)
         ═══════════════════════════════════════════════════════════════════ -->
    <app-event-list
      [events]="events()"
      [isLoading]="isLoadingEvents()"
      [hasWeddingSelected]="hasWeddingSelected()"
      (action)="handleAction($event)"
      (createEvent)="onCreateEvent()"
    />

  </div>
</div>
