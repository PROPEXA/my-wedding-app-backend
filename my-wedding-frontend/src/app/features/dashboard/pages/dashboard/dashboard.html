<!-- ═══════════════════════════════════════════════════════════════════════════
     WELCOME PAGE - Dashboard de bienvenida
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="min-h-screen bg-linear-to-br from-rose-50 via-pink-50 to-purple-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: SALUDO DE BIENVENIDA
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="mb-8">
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="bg-linear-to-r from-rose-400 to-pink-500 px-6 py-8 sm:px-10 sm:py-12">
          <div class="flex flex-col sm:flex-row items-center gap-4 sm:gap-6">
            <!-- Avatar -->
            <div
              class="w-20 h-20 sm:w-24 sm:h-24 bg-white/20 rounded-full flex items-center justify-center ring-4 ring-white/30"
            >
              <svg
                class="w-10 h-10 sm:w-12 sm:h-12 text-white"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>

            <!-- Texto de bienvenida -->
            <div class="text-center sm:text-left">
              <p class="text-rose-100 text-sm sm:text-base mb-1">{{ greeting() }},</p>
              <h1 class="text-2xl sm:text-4xl font-bold text-white mb-2">
                ¡Bienvenido, {{ userName() }}!
              </h1>
              <p class="text-rose-100 text-sm sm:text-base">
                Estamos felices de ayudarte a planificar tu día especial
              </p>
            </div>
          </div>
        </div>

        <!-- Barra decorativa -->
        <div class="h-1 bg-linear-to-r from-rose-300 via-pink-400 to-purple-400"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: ESTADÍSTICAS RÁPIDAS
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="mb-8">
      <div class="mb-8">
        <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
            />
          </svg>
          Resumen
        </h2>

        <!-- SELECCIÓN DE BODA -->
        <div class="flex flex-col sm:flex-row gap-4">
          <div class="flex-1">
            <div
              class="appDropdown w-full"
              dropdownId="weddingSelector"
              placeholder="Selecciona una boda"
              label="Listado de Bodas"
              [options]="weddingOptions()"
              (selectionChange)="onWeddingSelected($event)"
            ></div>
          </div>
          <div class="sm:flex sm:items-end">
            <app-button
              type="submit"
              theme="outline-primary"
              [disabled]="!selectedWeddingId()"
              [fullWidth]="true"
              (click)="loadWeddingStats()"
              >Consultar</app-button
            >
          </div>
        </div>
      </div>

      <!-- TARJETAS DE ESTADÍSTICAS -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 [&>*:only-child]:lg:col-span-2">
        <app-stats-card
          [stats]="myWeddingStatistic()"
          type="wedding"
        />
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: ACCIONES RÁPIDAS
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="mb-8">
      <h2 class="text-lg sm:text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          />
        </svg>
        Acciones Rápidas
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <app-card-action
          title="Nueva Boda"
          description="Crea un nuevo evento de boda"
          icon="plus"
          route="/app/weddings/new"
        />
        <app-card-action
          title="Mis Bodas"
          description="Ver y gestiona tus bodas"
          icon="heart"
          route="/app/weddings"
        />
        <app-card-action
          title="Invitaciones"
          description="Gestiona tus invitaciones"
          icon="email"
          route="/app/invitations"
        />
        <app-card-action
          title="Calendario"
          description="Revisa tu calendario de eventos"
          icon="calendar"
          route="/app/calendar"
        />
      </div>
    </section>
  </div>
</div>
