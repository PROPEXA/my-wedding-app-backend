<!-- ═══════════════════════════════════════════════════════════════════════════
     WEDDINGS PANEL - Panel de control de bodas
     ═══════════════════════════════════════════════════════════════════════════ -->
<div class="min-h-screen bg-linear-to-br from-rose-50 via-pink-50 to-purple-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: HEADER DEL PANEL
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="mb-8">
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
        <div class="bg-linear-to-r from-rose-400 to-pink-500 px-6 py-6 sm:px-8 sm:py-8">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <!-- Título -->
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 bg-white/20 rounded-xl flex items-center justify-center">
                <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
                </svg>
              </div>
              <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white">Mis Bodas</h1>
                <p class="text-rose-100 text-sm">Gestiona todos tus eventos de boda</p>
              </div>
            </div>

            <!-- Botón Nueva Boda -->
            <app-button
              type="button"
              theme="light"
              size="md"
              [fullWidth]="false"
              [onClickHandlers]="[onCreateWedding]"
            >
              <span class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                </svg>
                Nueva Boda
              </span>
            </app-button>
          </div>
        </div>

        <!-- Barra decorativa -->
        <div class="h-1 bg-linear-to-r from-rose-300 via-pink-400 to-purple-400"></div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: BARRA DE BÚSQUEDA Y FILTROS
         ═══════════════════════════════════════════════════════════════════ -->
    <section class="mb-6">
      <div class="bg-white rounded-xl shadow-md p-4">
        <div class="flex flex-col sm:flex-row gap-4">
          <!-- Campo de búsqueda -->
          <div class="flex-1 relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input
              type="text"
              placeholder="Buscar por nombre de pareja o lugar..."
              class="w-full pl-10 pr-4 py-3 border-2 border-rose-200 rounded-lg focus:outline-none focus:border-rose-400 transition-colors"
              [value]="searchTerm()"
              (input)="searchTerm.set($any($event.target).value)"
            />
          </div>

          <!-- Contador de bodas -->
          <div class="flex items-center gap-2 px-4 py-2 bg-rose-50 rounded-lg">
            <svg class="w-5 h-5 text-rose-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
            </svg>
            <span class="text-rose-700 font-semibold">{{ weddings().length }} bodas</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════════
         SECCIÓN: LISTADO DE BODAS (Componente)
         ═══════════════════════════════════════════════════════════════════ -->
    <app-wedding-list
      [weddings]="weddings()"
      [isLoading]="isLoading()"
      (action)="handleAction($event)"
      (createWedding)="onCreateWedding()"
    />

    <!-- ═══════════════════════════════════════════════════════════════════
         FOOTER DECORATIVO
         ═══════════════════════════════════════════════════════════════════ -->
  </div>
</div>
