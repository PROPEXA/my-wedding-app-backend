<!-- ═══════════════════════════════════════════════════════════════════
     EMPTY STATE - Estado vacío cuando no hay bodas
     ═══════════════════════════════════════════════════════════════════ -->
<section class="bg-white rounded-xl shadow-md p-12 text-center">
  <!-- Icono decorativo -->
  <div class="w-24 h-24 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-6">
    <svg class="w-12 h-12 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
    </svg>
  </div>

  <!-- Mensaje -->
  <h3 class="text-xl font-semibold text-gray-800 mb-2">No tienes bodas aún</h3>
  <p class="text-gray-500 mb-6">Comienza creando tu primera boda y empieza a planificar tu día especial</p>

  <!-- Botón crear -->
  <app-button
    type="button"
    theme="primary"
    size="md"
    [fullWidth]="false"
    [onClickHandlers]="[onCreateWedding]"
  >
    <span class="flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
      Crear mi primera boda
    </span>
  </app-button>
</section>
