<!-- ═══════════════════════════════════════════════════════════════════
     WEDDING LIST - Lista de bodas con carga y estado vacío
     ═══════════════════════════════════════════════════════════════════ -->

<!-- Estado de carga -->
@if (isLoading()) {
  <section class="flex justify-center items-center py-20">
    <div class="text-center">
      <svg class="animate-spin h-12 w-12 text-rose-500 mx-auto mb-4" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      <p class="text-gray-500">Cargando tus bodas...</p>
    </div>
  </section>
}

<!-- Contenido principal -->
@if (!isLoading()) {
  @if (weddings().length === 0) {
    <!-- Estado vacío -->
    <app-wedding-empty-state (createWedding)="onCreateWedding()" />
  } @else {
    <!-- Grid de bodas -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (wedding of weddings(); track wedding.id) {
        <app-wedding-card
          [wedding]="wedding"
          [isMenuOpen]="isMenuOpen(wedding.id)"
          (action)="onCardAction($event)"
          (menuToggle)="toggleMenu($event)"
        />
      }
    </section>
  }
}

<!-- Overlay para cerrar menú -->
@if (openMenuId() !== null) {
  <div
    class="fixed inset-0 z-0"
    (click)="closeMenu()"
  ></div>
}
