@if (label()) {
  <label class="block text-sm font-semibold text-gray-700 mb-2">
    {{ label() }}
  </label>
}

<input
  [type]="type()"
  [placeholder]="placeholder()"
  [value]="value()"
  (input)="onInputChange($event)"
  (blur)="onBlur($event)"
  (keypress)="onKeyPress($event)"
  class="w-full px-4 py-3 border-2 border-rose-200 rounded-lg focus:outline-none focus:border-rose-500 transition"
/>
